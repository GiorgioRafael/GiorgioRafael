name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to the output branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$remote" output >/dev/null 2>&1; then
            git clone --depth 1 --branch output --single-branch "$remote" published
          else
            git init --initial-branch=output published
            git -C published remote add origin "$remote"
          fi

          cp dist/github-snake.svg published/
          cp dist/github-snake-dark.svg published/

          git -C published config user.name "GiorgioRafael"
          git -C published config user.email "131801417+GiorgioRafael@users.noreply.github.com"
          git -C published add github-snake.svg github-snake-dark.svg

          if git -C published diff --cached --quiet; then
            echo "Snake SVGs are already up to date."
            exit 0
          fi

          git -C published commit -m "chore: atualizar cobrinha de contribuições"
          git -C published push origin output
