<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Giorgio Rafael — Desenvolvedor Full-stack, Mobile e Windows</title>
  <desc id="description">Banner profissional em tons de azul, ciano e violeta com o nome Giorgio Rafael.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f" />
      <stop offset="0.52" stop-color="#10152d" />
      <stop offset="1" stop-color="#0b1020" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.42" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.36" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)" />
  <rect width="1200" height="320" rx="28" fill="url(#grid)" />
  <circle cx="108" cy="64" r="220" fill="url(#glowBlue)" />
  <circle cx="1090" cy="272" r="260" fill="url(#glowPurple)" />

  <g opacity="0.9" filter="url(#softGlow)">
    <circle cx="95" cy="235" r="4" fill="#22d3ee" />
    <circle cx="1110" cy="74" r="4" fill="#a78bfa" />
    <path d="M76 235 H182" stroke="#22d3ee" stroke-opacity="0.44" stroke-width="2" />
    <path d="M1018 74 H1124" stroke="#a78bfa" stroke-opacity="0.44" stroke-width="2" />
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="386" y="46" width="428" height="36" rx="18" fill="#111827" stroke="#334155" />
    <circle cx="411" cy="64" r="5" fill="#34d399" />
    <text x="617" y="70" fill="#cbd5e1" font-size="15" font-weight="600" letter-spacing="2.2">SOFTWARE • PRODUTO • ENGENHARIA</text>

    <text x="600" y="164" fill="url(#accent)" font-size="66" font-weight="800" letter-spacing="-2">Giorgio Rafael</text>
    <text x="600" y="211" fill="#f8fafc" font-size="27" font-weight="600">Full-stack • Mobile • Windows</text>
    <text x="600" y="253" fill="#94a3b8" font-size="20">Construindo produtos confiáveis, do código à produção.</text>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="2" />
</svg>
